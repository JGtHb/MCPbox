version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "backend"
    open-pull-requests-limit: 10
    groups:
      backend-deps:
        patterns:
          - "*"

  # Sandbox Python dependencies
  - package-ecosystem: "pip"
    directory: "/sandbox"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "sandbox"
    open-pull-requests-limit: 10
    groups:
      sandbox-deps:
        patterns:
          - "*"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 10
    groups:
      frontend-deps:
        patterns:
          - "*"

  # Worker npm dependencies
  - package-ecosystem: "npm"
    directory: "/worker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "worker"
    open-pull-requests-limit: 5
    groups:
      worker-deps:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    groups:
      ci-deps:
        patterns:
          - "*"

  # Docker base images — all directories grouped into one PR
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    groups:
      docker-backend:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    groups:
      docker-frontend:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/sandbox"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    groups:
      docker-sandbox:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/cloudflared"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    groups:
      docker-cloudflared:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/socks-proxy"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "JGtHb"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    groups:
      docker-socks-proxy:
        patterns:
          - "*"
